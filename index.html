<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Middletown Weather Widget</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .weather-widget {
        width: 320px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        padding: 20px;
        text-align: center;
    }

    .city {
        font-size: 1.4rem;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .temp {
        font-size: 3rem;
        color: #0077cc;
        margin: 10px 0;
    }

    .condition {
        font-size: 1.1rem;
        margin-bottom: 15px;
    }

    .details {
        text-align: left;
        margin-top: 15px;
        line-height: 1.8;
    }

    button {
        margin-top: 15px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #0077cc;
        color: white;
        cursor: pointer;
        font-size: 1rem;
    }

    button:hover {
        background: #005fa3;
    }

    .updated {
        margin-top: 12px;
        font-size: 0.8rem;
        color: #666;
    }
</style>
</head>
<body>

<div class="weather-widget">
    <div class="city">Middletown, Ohio</div>

    <div class="temp" id="temp">--°F</div>
    <div class="condition" id="condition">Loading...</div>

    <div class="details">
        <div><strong>Humidity:</strong> <span id="humidity">--</span>%</div>
        <div><strong>Wind:</strong> <span id="wind">--</span> mph</div>
    </div>

    <button onclick="fetchWeather()">Refresh Now</button>

    <div class="updated" id="updated">
        Last updated: --
    </div>
</div>

<script>
const LAT = 39.5151;
const LON = -84.3983;

function weatherCodeToText(code) {
    const map = {
        0: "Clear Sky",
        1: "Mostly Clear",
        2: "Partly Cloudy",
        3: "Overcast",
        45: "Fog",
        48: "Rime Fog",
        51: "Light Drizzle",
        53: "Drizzle",
        55: "Heavy Drizzle",
        61: "Light Rain",
        63: "Rain",
        65: "Heavy Rain",
        71: "Light Snow",
        73: "Snow",
        75: "Heavy Snow",
        80: "Rain Showers",
        81: "Rain Showers",
        82: "Heavy Showers",
        95: "Thunderstorm"
    };

    return map[code] || "Unknown";
}

async function fetchWeather() {
    try {
        const url =
            `https://api.open-meteo.com/v1/forecast` +
            `?latitude=${LAT}` +
            `&longitude=${LON}` +
            `&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m` +
            `&temperature_unit=fahrenheit` +
            `&wind_speed_unit=mph`;

        const response = await fetch(url);
        const data = await response.json();

        const current = data.current;

        document.getElementById("temp").textContent =
            `${Math.round(current.temperature_2m)}°F`;

        document.getElementById("humidity").textContent =
            current.relative_humidity_2m;

        document.getElementById("wind").textContent =
            Math.round(current.wind_speed_10m);

        document.getElementById("condition").textContent =
            weatherCodeToText(current.weather_code);

        document.getElementById("updated").textContent =
            "Last updated: " + new Date().toLocaleTimeString();

    } catch (error) {
        console.error(error);
        document.getElementById("condition").textContent =
            "Unable to load weather";
    }
}

// Initial load
fetchWeather();

// Auto-refresh every 10 minutes
setInterval(fetchWeather, 600000);
</script>

</body>
</html>
